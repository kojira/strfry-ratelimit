# strfry-ratelimit config file. Point the plugin at it with RL_CONFIG_FILE=/path/to/this.
#
# Format: `key = value`, one per line; `#` starts a comment; blank/unknown lines ignored.
# Keys are the environment-variable names without the RL_ prefix, lowercased.
#
# HOT-RELOAD: the plugin re-reads this file (and ban_list_file) whenever it changes on disk, so
# you can adjust any setting or ban/unban a pubkey WITHOUT restarting strfry. In-memory
# rate-limit state is preserved across reloads.

# Kinds dropped outright, before rate limiting (single kinds and/or inclusive lo-hi ranges):
block_kinds        = 20001, 22000-22999

# Exact sourceInfo values whose ephemeral events (20000-29999) are blocked.
# Direct relay input uses the client/realIpHeader address; stream/sync uses the upstream URL.
# Other kinds from these sources and all events from other sources remain unaffected.
#block_ephemeral_sources = 149.28.29.200, 2001:db8::10
#block_source_mode       = shadow              # reject (default) | shadow

# Exact trusted sourceInfo values excluded from the per-pubkey sliding window.
# Use for known forwarders whose copies can race direct delivery. Existing bans
# and relay-wide ceilings still apply; only end-user attribution is skipped.
#exempt_rate_limit_sources = 149.28.29.200, 2001:db8::10

# Do not count events whose created_at is older than this (seconds) against the
# per-pubkey window. The window measures arrival time, so without this a relay or
# client re-syncing an author's backlog gets the AUTHOR banned. 0 = off (default).
# Banlist and relay-wide ceilings still apply to old events.
#count_max_age_seconds = 600

# Per-event audit trail: one TSV line per decided event, written to
# <dir>/audit-YYYYMMDD.tsv (UTC day). Columns:
#   arrival_unix.ms  source_ip  event_id  pubkey  kind  created_at  request_bytes  action  reason
# Keeps only what the relay DB cannot tell you later (which IP sent which event,
# and what was rejected). Compress/expire old days with scripts/audit-compact.sh.
#audit_log_dir = /var/log/strfry-audit

# Chunked file uploads disguised as app data: kind 30078, d tag `file_<id>_<n>`,
# content >= 8 KiB. off (default) | ignore (shadowReject, no ban) | ban
#file_chunk_action = ban

# Reject build-time source publishing (gnostr get_file_hash: files as kind 1, per-file kind 0,
# NIP-34 test fixtures). Matched by shape, never banned.
#block_build_publish = true

# Per-pubkey sliding-window rate limit. Distinct accepted event IDs count once;
# duplicate delivery of an accepted ID during this window is not charged again:

window_seconds     = 180
max_events         = 100
mode               = reject                       # reject | shadow
ban_on_exceed      = false
ban_list_file      = ./strfry-db/banned-pubkeys.txt
exclude_kinds      = 7
exempt_ephemeral   = true
exempt_replaceable = true
exempt_addressable = false

# Relay-wide ceiling on ephemeral events (kinds 20000-29999), events/second.
# Defends against a DISTRIBUTED flood that per-pubkey limits cannot see: many
# pubkeys each sending a modest rate, summing to a firehose. Kind-agnostic, so
# an attacker switching ephemeral kinds is still capped. Note it is a single
# FCFS budget with no per-sender fairness: it caps total relay load (the relay
# stays up, non-ephemeral traffic is untouched) but during a flood it degrades
# everyone's ephemeral traffic by volume share. Over-limit events are rejected
# with a "rate-limited:" reason so cooperative clients back off on their own;
# set ceiling_mode = shadow to drop them silently (OK true) instead.
# Size from your measured baseline + headroom; 0 disables. Example below suits a
# relay whose real ephemeral traffic is well under 1/sec.
# Left at 0 (off) so this sample does not silently change behaviour when adopted.
# Measure your relay's real ephemeral rate first, then set both (e.g. 5 and 30).
#ephemeral_rate_per_sec = 5
#ephemeral_burst        = 30

# All-kinds backstop: the ephemeral ceiling above only covers 20000-29999, so an
# attacker can move a distributed flood to another range. This caps TOTAL event
# rate. It applies to legitimate traffic too (including relay-to-relay sync
# bursts), so set it well above your measured non-ephemeral peak -- the relays
# this was tuned on peaked at 4-6/s, hence 50/s with a burst of 100. 0 disables.
#total_rate_per_sec = 50
#total_burst        = 100

# How the ceilings answer a shed event: reject (default; OK false with a
# "rate-limited:" reason that cooperative clients honour) or shadow (OK true,
# silently dropped -- for a source you don't want to tip off).
#ceiling_mode = reject

# Per-source limit: the same counted events summed over all pubkeys from one
# connecting address (IPv4 address, IPv6 /64). Catches senders that rotate
# throwaway keys. Size it well above your busiest legitimate address. 0 = off.
#source_window_seconds = 600
#source_max_events     = 200
#source_ban_on_exceed  = true
# Addressable kinds (30000-39999) are not counted toward the source window unless enabled.
#source_count_addressable = false
#source_ban_list_file  = /var/lib/strfry/banned-sources.txt
