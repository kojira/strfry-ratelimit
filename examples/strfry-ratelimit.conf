# strfry-ratelimit config file. Point the plugin at it with RL_CONFIG_FILE=/path/to/this.
#
# Format: `key = value`, one per line; `#` starts a comment; blank/unknown lines ignored.
# Keys are the environment-variable names without the RL_ prefix, lowercased.
#
# HOT-RELOAD: the plugin re-reads this file (and ban_list_file) whenever it changes on disk, so
# you can adjust any setting or ban/unban a pubkey WITHOUT restarting strfry. In-memory
# rate-limit state is preserved across reloads.

# Kinds dropped outright, before rate limiting (single kinds and/or inclusive lo-hi ranges):
block_kinds        = 20001, 22000-22999

# Per-pubkey sliding-window rate limit:
window_seconds     = 180
max_events         = 100
mode               = reject                       # reject | shadow
ban_on_exceed      = false
ban_list_file      = ./strfry-db/banned-pubkeys.txt
exclude_kinds      = 7
exempt_ephemeral   = true
exempt_replaceable = true
exempt_addressable = false
